paths:
  ssl_parquets:
    - data/ssl_all_spectra.parquet
  pair_pickle: data/siamese_crossmatched_pairs.pkl
  pair_spectra_dir: data
  clagn_test_pickle: data/siamese_crossmatched_pairs.pkl
  clagn_test_spectra_dir: data
  out_dir: models
  norm_stats: models/norm_stats.json
  pair_cache: models/pair_arrays_cache.npz
  ssl_checkpoint: models/ssl_encoder.pth
  siamese_checkpoint: models/siamese_changenet.pth

preprocessing:
  oiii_snr_min: 4.0

ssl:
  batch_size: 128
  num_epochs: 50
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  mask_ratio: 0.5
  min_span: 64
  max_span: 384
  val_frac: 0.05
  max_rows: null
  num_workers: 0
  seed: 42
  select_survey:
    - sdssv
    - dr16

siamese:
  batch_size: 64
  num_epochs: 40
  encoder_lr: 1.0e-4
  head_lr: 1.0e-3
  weight_decay: 1.0e-4
  dropout: 0.4
  focal_alpha: 0.5
  focal_gamma: 2.0
  synthetic_prob: 0.0
  encoder_freeze: true
  sampler_pos_rate: 0.3
  source_balanced: true
  select_survey_stage2: sdssv
  val_frac: 0.15
  test_frac: 0.0
  decision_threshold: 0.5
  fbeta_beta: 2.0
  min_recall: 0.30
  max_fpr: 0.05
  num_workers: 0
  seed: 42
