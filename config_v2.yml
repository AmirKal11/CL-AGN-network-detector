# config_v2.yml -- configuration for the redesigned CL-AGN pipeline (v2).
# All paths are relative to the project root.


paths:

  _legacy_data: &LEGACY "/Users/amir/Documents/Deep learning/cl-agn classifier -Legacy version/data_v4"

  ssl_parquets:
    # DR7 capped at 12k/type (~24k total) — more balanced survey exposure.
    # Built by: conda run -n astro_dl python src/cap_dr7_parquet.py
    - "/Users/amir/Documents/Deep learning/cl-agn-classifier/data/ssl_all_spectra_uncapped_DR7.parquet"
  # Stage 2: real same-object epoch pairs.
  pair_pickle: "/Users/amir/Documents/Deep learning/cl-agn classifier -Legacy version/data_v4/dr16_sdssv_phase2_train.pkl"
  pair_spectra_dir: "/Users/amir/Documents/Deep learning/cl-agn classifier -Legacy version/data_v4"
  # Held-out unseen test (used by the eval script, not by the trainer).
  clagn_test_pickle: "/Users/amir/Documents/Deep learning/cl-agn classifier -Legacy version/data_v4/clagn_test.pkl"
  clagn_test_spectra_dir: "/Users/amir/Documents/Deep learning/cl-agn classifier -Legacy version/data_v4"
  # Outputs.
  #   sdssv_weighted (this run)      : models/sdssv_weighted       <-- active
  #   fixed_OIII (best so far)       : models/fixed_OIII
  #   raw_continuum (no cont. sub.)  : models/raw_continuum_full_dr7
  #   v4 (confound-free, SDSS-V)    : models/clagn_v4  (baseline)
  out_dir: models/sdssv_weighted
  norm_stats: models/sdssv_weighted/norm_stats.json
  pair_cache: models/sdssv_weighted/pair_arrays_cache.npz
  ssl_checkpoint: models/sdssv_weighted/ssl_encoder.pth
  siamese_checkpoint: models/sdssv_weighted/siamese_changenet.pth

preprocessing:
  oiii_snr_min: 4.0          # below this the [OIII] channel falls back to MAD

ssl:                          # Stage 1 -- masked-reconstruction pretraining
  batch_size: 128
  num_epochs: 50
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  mask_ratio: 0.5             # fraction of the COVERED region blanked per sample
  min_span: 64               # span sizes scaled x4 for the 4096-px wide grid
  max_span: 384              # (were 16 / 96 on the old 1024-px grid)
  val_frac: 0.05
  max_rows: null             # cap the SSL pool (null = use everything)
  num_workers: 0             # data is in-memory; workers would just copy it
  seed: 42
  # Per-survey loss weights — upweight deployment surveys to reduce domain gap.
  # Set all to 1.0 to disable. sdssv/dr16 get 3x more gradient signal than dr7/desi.
  survey_loss_weights:
    sdssv:    3.0
    dr16:     3.0
    sdss_dr7: 1.0
    desi:     1.0
  select_survey: [sdssv, dr16]   # v4: checkpoint encoder on recon val of these
                                 # (deployment) surveys only, not the global pool

siamese:                      # Stage 2 -- change detector on real pairs
  batch_size: 64
  num_epochs: 40
  encoder_lr: 1.0e-4         # ignored when encoder_freeze is true
  head_lr: 1.0e-3           # higher LR for the fresh change head
  weight_decay: 1.0e-4
  dropout: 0.4
  focal_alpha: 0.5
  focal_gamma: 2.0
  synthetic_prob: 0.0        # 0 = real-pairs only (no make_synthetic_change)
  encoder_freeze: true       # linear-probe regime: keep SSL features fixed,
                             # train only the change head. Fits the 468-pos
                             # training pool while preventing fine-tune
                             # gradients from amplifying survey-pair signals.
  sampler_pos_rate: 0.3      # v4: raised 0.2->0.3 (recall-first; more positive
                             # exposure per batch). WeightedRandomSampler target.
  source_balanced: true      # v4: split positive mass EQUALLY across surveys so
                             # the head sees scarce SDSS-V positives as often as DESI.
  # v4: checkpoint selected on the MEAN of per-survey PR-AUC (each survey weighted
  # equally so the larger DESI count doesn't drown SDSS-V); deployment threshold
  # taken on the SDSS-V subset at FPR<=max_fpr. (select_survey_stage2 is now unused.)
  select_survey_stage2: sdssv
  val_frac: 0.15
  test_frac: 0.0             # no internal test -- clagn_test.pkl is the held-out test
  decision_threshold: 0.5    # only used by downstream scripts; the trainer
                             # ignores this and picks its own threshold via
                             # the F-beta sweep below.
  # ---- F-beta threshold sweep (mirrors train_siamese.py / v1) ---------
  # Each epoch the chosen threshold is the one that:
  #   1. has recall >= min_recall  AND  fpr <= max_fpr
  #   2. among survivors, maximises (fbeta, precision, -fpr, recall)
  # If no threshold passes step 1, fall back to argmax fbeta and flag it.
  fbeta_beta: 2.0            # v4 recall-first: F2 weights RECALL 2x over precision
                             # (candidate ranker; threshold is a deployment param
                             # tuned on new data, never on the held-out test).
  min_recall: 0.30           # v4: require >=30% TPR (was 0.10)
  max_fpr:    0.05           # v4: allow up to 5% FPR (was 0.01) -- purity relaxed
  num_workers: 0             # pairs are preprocessed once into RAM
  seed: 42
