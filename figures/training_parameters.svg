<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .card { fill:#ffffff; stroke:#c3cedb; stroke-width:2; rx:12; }
      .net  { fill:#ffffff; stroke:#8b73d6; stroke-width:2.5; rx:12; }
      .title{ font-size:32px; font-weight:700; fill:#1b2733; }
      .sub  { font-size:18px; fill:#5b6b7c; font-style:italic; }
      .ph   { font-size:21px; font-weight:700; fill:#1b2733; }
      .k    { font-size:16px; fill:#5b6b7c; }
      .v    { font-size:16px; fill:#1b2733; font-weight:600; }
      .b    { font-size:16px; fill:#33465a; }
      .n    { font-size:15px; fill:#5b6b7c; font-style:italic; }
      .em   { font-weight:700; fill:#1b2733; }
    </style>
  </defs>

  <text class="title" x="60" y="60">Training configuration&#8195;<tspan font-size="20px" font-weight="400" fill="#5b6b7c">(config_v2.yml &#183; run: models/weighted_loss_per_Z)</tspan></text>
  <text class="sub" x="60" y="92">backup slide &#8212; every value below is read from the config at run time; Apple Silicon MPS, PyTorch, conda env astro_dl</text>

  <rect class="net" x="60" y="128" width="720" height="474.0"/>
  <text class="ph" x="90" y="172">Phase 1 &#8212; masked-autoencoder pre-training</text>
  <rect x="76" y="190.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="90" y="210.0">optimizer</text>
  <text class="v" x="750" y="210.0" text-anchor="end">AdamW &#183; cosine annealing (T&#8320; = 50)</text>
  <text class="k" x="90" y="240.5">learning rate</text>
  <text class="v" x="750" y="240.5" text-anchor="end">3 &#215; 10&#8315;&#8308;</text>
  <rect x="76" y="251.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="90" y="271.0">weight decay</text>
  <text class="v" x="750" y="271.0" text-anchor="end">1 &#215; 10&#8315;&#8308;</text>
  <text class="k" x="90" y="301.5">batch size</text>
  <text class="v" x="750" y="301.5" text-anchor="end">128</text>
  <rect x="76" y="312.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="90" y="332.0">epochs</text>
  <text class="v" x="750" y="332.0" text-anchor="end">50</text>
  <text class="k" x="90" y="362.5">gradient clipping</text>
  <text class="v" x="750" y="362.5" text-anchor="end">max-norm 1.0</text>
  <rect x="76" y="373.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="90" y="393.0">objective</text>
  <text class="v" x="750" y="393.0" text-anchor="end">MSE on masked &#8743; covered pixels</text>
  <text class="k" x="90" y="423.5">mask ratio</text>
  <text class="v" x="750" y="423.5" text-anchor="end">0.50 of the covered range</text>
  <rect x="76" y="434.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="90" y="454.0">mask span length</text>
  <text class="v" x="750" y="454.0" text-anchor="end">64 &#8211; 384 px (contiguous)</text>
  <text class="k" x="90" y="484.5">per-sample weights</text>
  <text class="v" x="750" y="484.5" text-anchor="end">survey &#215; &#916;z=0.1 balancing, floor 0.05</text>
  <rect x="76" y="495.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="90" y="515.0">validation split</text>
  <text class="v" x="750" y="515.0" text-anchor="end">5%</text>
  <text class="k" x="90" y="545.5">checkpoint metric</text>
  <text class="v" x="750" y="545.5" text-anchor="end">recon MSE on SDSS-V + DR16 val</text>
  <rect x="76" y="556.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="90" y="576.0">seed</text>
  <text class="v" x="750" y="576.0" text-anchor="end">42</text>

  <rect class="net" x="820" y="128" width="720" height="474.0"/>
  <text class="ph" x="850" y="172">Phase 2 &#8212; Siamese change head</text>
  <rect x="836" y="190.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="850" y="210.0">optimizer</text>
  <text class="v" x="1510" y="210.0" text-anchor="end">AdamW &#183; cosine annealing (T&#8320; = 40)</text>
  <text class="k" x="850" y="240.5">head learning rate</text>
  <text class="v" x="1510" y="240.5" text-anchor="end">1 &#215; 10&#8315;&#179;</text>
  <rect x="836" y="251.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="850" y="271.0">encoder learning rate</text>
  <text class="v" x="1510" y="271.0" text-anchor="end">&#8212; (frozen; 1e-4 in config, unused)</text>
  <text class="k" x="850" y="301.5">weight decay</text>
  <text class="v" x="1510" y="301.5" text-anchor="end">1 &#215; 10&#8315;&#8308;</text>
  <rect x="836" y="312.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="850" y="332.0">batch size</text>
  <text class="v" x="1510" y="332.0" text-anchor="end">64</text>
  <text class="k" x="850" y="362.5">epochs</text>
  <text class="v" x="1510" y="362.5" text-anchor="end">40</text>
  <rect x="836" y="373.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="850" y="393.0">dropout</text>
  <text class="v" x="1510" y="393.0" text-anchor="end">0.40 / 0.24 (head blocks 1 / 2)</text>
  <text class="k" x="850" y="423.5">loss</text>
  <text class="v" x="1510" y="423.5" text-anchor="end">binary focal, &#945; = 0.5, &#947; = 2.0</text>
  <rect x="836" y="434.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="850" y="454.0">sampler</text>
  <text class="v" x="1510" y="454.0" text-anchor="end">30% positives, source-balanced</text>
  <text class="k" x="850" y="484.5">synthetic positives</text>
  <text class="v" x="1510" y="484.5" text-anchor="end">disabled (synthetic_prob = 0)</text>
  <rect x="836" y="495.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="850" y="515.0">validation split</text>
  <text class="v" x="1510" y="515.0" text-anchor="end">15%  (internal test 0 &#8212; held-out pickle)</text>
  <text class="k" x="850" y="545.5">checkpoint metric</text>
  <text class="v" x="1510" y="545.5" text-anchor="end">mean per-survey PR-AUC</text>
  <rect x="836" y="556.0" width="688" height="30" fill="#f3efff" opacity="0.35"/>
  <text class="k" x="850" y="576.0">threshold rule</text>
  <text class="v" x="1510" y="576.0" text-anchor="end">max recall s.t. FPR &#8804; 5% (SDSS-V)</text>

  <rect class="card" x="60" y="626.0" width="1480" height="128"/>
  <text class="ph" x="90" y="668.0">Architecture &#8212; fixed, not swept</text>
  <text class="b"  x="90" y="702.0"><tspan class="em">Encoder</tspan> input [2, 4096] &#8594; 3 multi-scale conv blocks (kernels 3&#8211;31, 64/128/256 ch) &#8594; 512 tokens &#215; 256 &#8594; 8-head self-attention &#8594; avg+max pool &#8594; <tspan class="em">512-d</tspan></text>
  <text class="b"  x="90" y="728.0"><tspan class="em">Decoder</tspan> (Phase 1 only) 3 &#215; (upsample &#215;2 + conv k=5 + GroupNorm + GELU) &#8594; [2, 4096]&#8195;&#8226;&#8195;<tspan class="em">Head</tspan> 1536 &#8594; 512 &#8594; 128 &#8594; 1, output bias initialised to the log-odds of the positive rate</text>

  <text class="n" x="60" y="792.0">Config keys present but not read by the code: <tspan font-style="normal" font-weight="600">ssl.survey_loss_weights</tspan> (SSL weighting comes from the dataset&#8217;s survey &#215; z-bin balancing)</text>
  <text class="n" x="60" y="816.0">and <tspan font-style="normal" font-weight="600">siamese.decision_threshold</tspan> (the trainer derives its own).&#8195;<tspan font-style="normal" font-weight="600">fbeta_beta = 2.0</tspan> / <tspan font-style="normal" font-weight="600">min_recall = 0.30</tspan> are checkpoint metadata, used only by</text>
  <text class="n" x="60" y="840.0">the F&#8322; diagnostic sweep in eval_clagn_test.py &#8212; they do not set the deployed threshold.</text>
</svg>
