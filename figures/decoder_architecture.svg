<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrc" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <!-- title -->
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">SpectraDecoder — Layer-by-layer architecture</text>
  <text x="500" y="54" text-anchor="middle" font-size="12" fill="#64748b">Input: [B, 256, 512]  →  Output: [B, 2, 4096]&#8195;·&#8195;Phase 1 only — discarded after pre-training</text>

  <!-- ===== INPUT ===== -->
  <rect x="20" y="200" width="112" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="76" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Encoder</text>
  <text x="76" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">feature map</text>
  <text x="76" y="260" text-anchor="middle" font-size="10" fill="#475569">[B, 256, 512]</text>
  <line x1="132" y1="236" x2="156" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===== UP BLOCK 1 ===== -->
  <rect x="158" y="96" width="168" height="280" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="242" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#155e75">Up block 1</text>
  <text x="242" y="133" text-anchor="middle" font-size="10" fill="#0891b2">ch 256 → 128</text>

  <rect x="170" y="146" width="144" height="38" rx="5" fill="#cffafe" stroke="#0891b2"/>
  <text x="242" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">Upsample ×2</text>
  <text x="242" y="176" text-anchor="middle" font-size="9" fill="#155e75">mode = nearest</text>

  <rect x="170" y="192" width="144" height="38" rx="5" fill="#cffafe" stroke="#0891b2"/>
  <text x="242" y="209" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">Conv1d 256→128</text>
  <text x="242" y="222" text-anchor="middle" font-size="9" fill="#155e75">k=5, padding=2</text>

  <rect x="170" y="238" width="144" height="30" rx="5" fill="#e0f7fa" stroke="#0891b2"/>
  <text x="242" y="258" text-anchor="middle" font-size="10" fill="#155e75">GroupNorm(1, 128)</text>

  <rect x="170" y="276" width="144" height="30" rx="5" fill="#e0f7fa" stroke="#0891b2"/>
  <text x="242" y="296" text-anchor="middle" font-size="10" fill="#155e75">GELU</text>

  <text x="242" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#0e7490">[B, 128, 1024]</text>
  <text x="242" y="356" text-anchor="middle" font-size="9" fill="#64748b">164k params</text>

  <line x1="328" y1="236" x2="350" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===== UP BLOCK 2 ===== -->
  <rect x="352" y="96" width="168" height="280" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="436" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#155e75">Up block 2</text>
  <text x="436" y="133" text-anchor="middle" font-size="10" fill="#0891b2">ch 128 → 64</text>

  <rect x="364" y="146" width="144" height="38" rx="5" fill="#cffafe" stroke="#0891b2"/>
  <text x="436" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">Upsample ×2</text>
  <text x="436" y="176" text-anchor="middle" font-size="9" fill="#155e75">mode = nearest</text>

  <rect x="364" y="192" width="144" height="38" rx="5" fill="#cffafe" stroke="#0891b2"/>
  <text x="436" y="209" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">Conv1d 128→64</text>
  <text x="436" y="222" text-anchor="middle" font-size="9" fill="#155e75">k=5, padding=2</text>

  <rect x="364" y="238" width="144" height="30" rx="5" fill="#e0f7fa" stroke="#0891b2"/>
  <text x="436" y="258" text-anchor="middle" font-size="10" fill="#155e75">GroupNorm(1, 64)</text>

  <rect x="364" y="276" width="144" height="30" rx="5" fill="#e0f7fa" stroke="#0891b2"/>
  <text x="436" y="296" text-anchor="middle" font-size="10" fill="#155e75">GELU</text>

  <text x="436" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#0e7490">[B, 64, 2048]</text>
  <text x="436" y="356" text-anchor="middle" font-size="9" fill="#64748b">41k params</text>

  <line x1="522" y1="236" x2="544" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===== UP BLOCK 3 ===== -->
  <rect x="546" y="96" width="168" height="280" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="630" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#155e75">Up block 3</text>
  <text x="630" y="133" text-anchor="middle" font-size="10" fill="#0891b2">ch 64 → 32</text>

  <rect x="558" y="146" width="144" height="38" rx="5" fill="#cffafe" stroke="#0891b2"/>
  <text x="630" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">Upsample ×2</text>
  <text x="630" y="176" text-anchor="middle" font-size="9" fill="#155e75">mode = nearest</text>

  <rect x="558" y="192" width="144" height="38" rx="5" fill="#cffafe" stroke="#0891b2"/>
  <text x="630" y="209" text-anchor="middle" font-size="10" font-weight="bold" fill="#155e75">Conv1d 64→32</text>
  <text x="630" y="222" text-anchor="middle" font-size="9" fill="#155e75">k=5, padding=2</text>

  <rect x="558" y="238" width="144" height="30" rx="5" fill="#e0f7fa" stroke="#0891b2"/>
  <text x="630" y="258" text-anchor="middle" font-size="10" fill="#155e75">GroupNorm(1, 32)</text>

  <rect x="558" y="276" width="144" height="30" rx="5" fill="#e0f7fa" stroke="#0891b2"/>
  <text x="630" y="296" text-anchor="middle" font-size="10" fill="#155e75">GELU</text>

  <text x="630" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#0e7490">[B, 32, 4096]</text>
  <text x="630" y="356" text-anchor="middle" font-size="9" fill="#64748b">10k params</text>

  <line x1="716" y1="236" x2="738" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===== OUTPUT CONV ===== -->
  <rect x="740" y="200" width="118" height="72" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <text x="799" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e293b">Conv1d 32→2</text>
  <text x="799" y="240" text-anchor="middle" font-size="9" fill="#475569">k=5, padding=2</text>
  <text x="799" y="260" text-anchor="middle" font-size="9" fill="#64748b">no activation</text>

  <line x1="858" y1="236" x2="880" y2="236" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- ===== RECONSTRUCTION ===== -->
  <rect x="882" y="200" width="100" height="72" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="932" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">Recon</text>
  <text x="932" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2563eb">[B, 2, 4096]</text>
  <text x="932" y="264" text-anchor="middle" font-size="9" fill="#64748b">same shape as x</text>

  <!-- ===== LOSS CALLOUT ===== -->
  <path d="M932,276 L932,406" fill="none" stroke="#c0653a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <rect x="700" y="410" width="282" height="66" rx="8" fill="#fdf7ee" stroke="#c9922f" stroke-width="1.8"/>
  <text x="841" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">Masked reconstruction MSE</text>
  <text x="841" y="449" text-anchor="middle" font-size="10" fill="#7c2d12">scored only on blanked, real-coverage pixels</text>
  <text x="841" y="465" text-anchor="middle" font-size="10" fill="#7c2d12">per-sample survey × redshift-bin weights</text>

  <!-- ===== NOTES ===== -->
  <rect x="20" y="410" width="660" height="166" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="432" font-size="11" font-weight="bold" fill="#1e293b">Notes</text>

  <rect x="40" y="442" width="10" height="10" fill="#cffafe" stroke="#0891b2"/>
  <text x="58" y="452" font-size="10" fill="#334155">Each up block is Upsample(×2, nearest) → Conv1d(k=5) → GroupNorm(1 group) → GELU. Three blocks take</text>
  <text x="58" y="466" font-size="10" fill="#334155">the 512-token feature map back to the full 4096-pixel grid (×8 overall).</text>

  <text x="40" y="490" font-size="10" fill="#334155">"Resize-convolution" (nearest + conv) instead of ConvTranspose1d: avoids checkerboard artefacts, and</text>
  <text x="40" y="504" font-size="10" fill="#334155">linear upsampling is not implemented on Apple-Silicon MPS.</text>

  <text x="40" y="528" font-size="10" fill="#334155">The decoder exists only to make the pre-training objective well posed. After Phase 1 it is discarded —</text>
  <text x="40" y="542" font-size="10" fill="#334155">only the encoder is carried into Phase 2.</text>

  <text x="40" y="566" font-size="10" fill="#334155">~216k decoder parameters total (164k / 41k / 10k across the three up blocks + 322 in the output conv).</text>
</svg>
