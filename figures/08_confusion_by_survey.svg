<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1000" height="600" fill="#ffffff"/>

  <text x="500" y="36" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">Held-out detection by survey pair</text>
  <text x="500" y="60" text-anchor="middle" font-size="13" fill="#475569">Phase A model (full retrain), decision threshold = 0.80  ·  precision = 1.00 in both (zero false positives)</text>
  <text x="500" y="80" text-anchor="middle" font-size="11.5" fill="#94a3b8">Negative controls (n = 350) are DR16 × SDSS-V static pairs, shared across both panels — the held-out test contains no DESI × DR16 negatives.</text>

  <!-- =================== PANEL A: DESI x DR16 =================== -->
  <text x="310" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">DESI × DR16  —  Paper-2 CL-AGN</text>

  <!-- cells: row1 = true neg, row2 = true pos ; col1 = pred neg, col2 = pred pos -->
  <rect x="170" y="140" width="140" height="116" fill="#08306b" stroke="#ffffff" stroke-width="2"/>
  <rect x="310" y="140" width="140" height="116" fill="#f7fbff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="170" y="256" width="140" height="116" fill="#c6dbef" stroke="#ffffff" stroke-width="2"/>
  <rect x="310" y="256" width="140" height="116" fill="#3a7bc0" stroke="#ffffff" stroke-width="2"/>
  <text x="240" y="207" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffffff">350</text>
  <text x="380" y="207" text-anchor="middle" font-size="27" font-weight="bold" fill="#334155">0</text>
  <text x="240" y="323" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e293b">8</text>
  <text x="380" y="323" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffffff">22</text>

  <!-- row labels -->
  <text x="160" y="203" text-anchor="end" font-size="13" fill="#475569">true neg</text>
  <text x="160" y="319" text-anchor="end" font-size="13" fill="#475569">true pos</text>
  <!-- col labels -->
  <text x="240" y="392" text-anchor="middle" font-size="13" fill="#475569">pred neg</text>
  <text x="380" y="392" text-anchor="middle" font-size="13" fill="#475569">pred pos</text>

  <text x="310" y="430" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="bold">recall 0.73</tspan>  (22/30)   ·   precision 1.00   ·   FPR 0.00</text>

  <!-- =================== PANEL B: DR16 x SDSS-V =================== -->
  <text x="700" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">DR16 × SDSS-V  —  low-z CL-AGN</text>

  <rect x="560" y="140" width="140" height="116" fill="#08306b" stroke="#ffffff" stroke-width="2"/>
  <rect x="700" y="140" width="140" height="116" fill="#f7fbff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="560" y="256" width="140" height="116" fill="#9ecae1" stroke="#ffffff" stroke-width="2"/>
  <rect x="700" y="256" width="140" height="116" fill="#deebf7" stroke="#ffffff" stroke-width="2"/>
  <text x="630" y="207" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffffff">350</text>
  <text x="770" y="207" text-anchor="middle" font-size="27" font-weight="bold" fill="#334155">0</text>
  <text x="630" y="323" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e293b">15</text>
  <text x="770" y="323" text-anchor="middle" font-size="27" font-weight="bold" fill="#1e293b">5</text>

  <text x="550" y="203" text-anchor="end" font-size="13" fill="#475569">true neg</text>
  <text x="550" y="319" text-anchor="end" font-size="13" fill="#475569">true pos</text>
  <text x="630" y="392" text-anchor="middle" font-size="13" fill="#475569">pred neg</text>
  <text x="770" y="392" text-anchor="middle" font-size="13" fill="#475569">pred pos</text>

  <text x="700" y="430" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="bold">recall 0.25</tspan>  (5/20)   ·   precision 1.00   ·   FPR 0.00</text>

  <!-- =================== takeaway =================== -->
  <rect x="150" y="470" width="700" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="500" text-anchor="middle" font-size="14" fill="#0f172a"><tspan font-weight="bold">2.9× recall gap at matched (perfect) precision.</tspan></text>
  <text x="500" y="524" text-anchor="middle" font-size="12.5" fill="#475569">DESI × DR16 transitions (one in-distribution epoch) are recovered far better than</text>
  <text x="500" y="542" text-anchor="middle" font-size="12.5" fill="#475569">DR16 × SDSS-V transitions, where both epochs were out-of-distribution for the encoder.</text>
</svg>
